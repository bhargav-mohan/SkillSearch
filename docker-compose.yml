version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL: ''   # empty = same-origin; set to backend URL if separate domains
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped
